function saveProfile() {

// ============ 计算函数 ============
function calculateBMR(p) {
  if (p.gender === 'male') {
    return 10 * p.weight + 6.25 * p.height - 5 * p.age + 5;
  } else {
    return 10 * p.weight + 6.25 * p.height - 5 * p.age - 161;
  }
}
const ACTIVITY = {
  'sedentary': 1.2, 'light': 1.375, 'moderate': 1.55, 'active': 1.725, 'very-active': 1.9
};
function calculateTDEE(p) {
  return Math.round(calculateBMR(p) * ACTIVITY[p.activityLevel]);
}
function calculateTargetCalories(p) {
  const tdee = calculateTDEE(p);
  if (p.goal === 'lose') return Math.round(tdee - 500);
  if (p.goal === 'gain') return Math.round(tdee + 500);
  return tdee;
}

function analyzePreference(records) {
  if (!records.length) {
    return { averageCalories: 0, mealDistribution: {breakfast:33,lunch:34,dinner:33}, frequentFoods: [] };
  }
  const foodCount = {};
  const mealCount = {breakfast:0,lunch:0,dinner:0};
  let totalCal = 0;
  records.forEach(r => {
    mealCount[r.mealType]++;
    totalCal += r.totalCalories;
    r.foods.forEach(f => { foodCount[f.name] = (foodCount[f.name]||0) + 1; });
  });
  const sortedFoods = Object.entries(foodCount)
    .map(([name,count]) => ({name,count}))
    .sort((a,b) => b.count - a.count)
    .slice(0, 10);
  const avg = records.length ? Math.round(totalCal / records.length) : 0;
  const total = mealCount.breakfast + mealCount.lunch + mealCount.dinner;
  const dist = total > 0 ? {
    breakfast: Math.round(mealCount.breakfast/total*100),
    lunch: Math.round(mealCount.lunch/total*100),
    dinner: Math.round(mealCount.dinner/total*100)
  } : {breakfast:33,lunch:34,dinner:33};
  return { averageCalories: avg, mealDistribution: dist, frequentFoods: sortedFoods };
}

// ============ HTML 渲染工具 ============
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      if (k === 'class') el.className = attrs[k];
      else if (k === 'style' && typeof attrs[k] === 'object') Object.assign(el.style, attrs[k]);
      else if (k.startsWith('on') && typeof attrs[k] === 'function') {
        el.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
      } else if (k === 'value') el.value = attrs[k];
      else el.setAttribute(k, attrs[k]);
    }
  }
  children.flat().forEach(c => {
    if (c == null || c === false) return;
    el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  });
  return el;
}

function getToday() {

}
function getMealRecord(mealType) {
  return getTodayRecords().find(r => r.mealType === mealType);
}
function addFoodToMeal(mealType, food) {
  const newFood = { foodId: food.id, name: food.name, portion: 100, calories: food.calories };
  const existing = getMealRecord(mealType);
  if (existing) {
    existing.foods.push(newFood);
    existing.totalCalories += food.calories;
  } else {
    STATE.records.push({
      id: getToday() + '-' + mealType + '-' + Date.now(),
      date: getToday(), mealType, foods: [newFood], totalCalories: food.calories
    });
  }
  saveRecords();
  render();
}
function removeFoodFromMeal(mealType, index) {
  const rec = getMealRecord(mealType);
  if (!rec) return;
  const removed = rec.foods[index];
  rec.foods.splice(index, 1);
  rec.totalCalories -= removed.calories;
  if (rec.foods.length === 0) {
    STATE.records = STATE.records.filter(r => r.id !== rec.id);
  }
  saveRecords();
  render();
}

function startApp() {
  STATE.isSetup = true;
  saveSetup();
  render();
}

function switchTab(tab) {
  STATE.activeTab = tab;
  STATE.selectedRecipe = null;
  render();
}

function startEdit() {
  STATE.editingProfile = JSON.parse(JSON.stringify(STATE.profile));
  STATE.isEditing = true;
  render();
}
function cancelEdit() {
  STATE.editingProfile = null;
  STATE.isEditing = false;
  render();
}
function saveEdit() {
  STATE.profile = STATE.editingProfile;
  STATE.editingProfile = null;
  STATE.isEditing = false;
  saveProfile();
  render();
}

function openPicker(mealType) {
  STATE.pickerOpen = mealType;
  STATE.searchQuery = '';
  render();
}
function closePicker() {
  STATE.pickerOpen = null;
  render();
}

function openRecipe(recipe) {
  STATE.selectedRecipe = recipe;
  render();
}
function closeRecipe() {
  STATE.selectedRecipe = null;
  render();
}

// ============ 页面渲染 ============
function render() {
  const root = document.getElementById('root');
  root.innerHTML = '';
  if (!STATE.isSetup) {
    root.appendChild(renderWelcome());
  } else {
    if (STATE.activeTab === 'profile') root.appendChild(renderProfile());
    else if (STATE.activeTab === 'intake') root.appendChild(renderIntake());
    else if (STATE.activeTab === 'analysis') root.appendChild(renderAnalysis());
    else if (STATE.activeTab === 'recipes') root.appendChild(renderRecipes());
    root.appendChild(renderNav());
    if (STATE.pickerOpen) root.appendChild(renderPicker());
  }
}

function renderIntake() {
  const target = calculateTargetCalories(STATE.profile);
  const today = getToday();
  const records = getTodayRecords();
  const total = records.reduce((s,r) => s + r.totalCalories, 0);
  const remaining = target - total;
  const percent = Math.min(100, (total / target) * 100);

  const wrap = h('div', {class:'page'});
  wrap.appendChild(h('h1', {class:'page-title'}, '今日饮食'));
  wrap.appendChild(h('p', {class:'page-subtitle'}, today));

  const card = h('div', {class:'card'});
  const ring = h('div', {class:'ring-progress'});
  const radius = 70;
  const circ = 2 * Math.PI * radius;
  const offset = circ - (percent/100) * circ;
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.innerHTML = '<circle cx="90" cy="90" r="' + radius + '" fill="none" stroke="#e5e7eb" stroke-width="12"/>' +
    '<circle cx="90" cy="90" r="' + radius + '" fill="none" stroke="' + (percent > 100 ? '#ef4444' : '#10b981') +
    '" stroke-width="12" stroke-dasharray="' + circ + '" stroke-dashoffset="' + offset + '" stroke-linecap="round"/>';
  ring.appendChild(svg);
  const text = h('div', {class:'ring-progress-text'});
  text.appendChild(h('div', {class:'ring-progress-value'}, String(total)));
  text.appendChild(h('div', {class:'ring-progress-label'}, '/ ' + target + ' 千卡'));
  const remainText = h('div', {class:'ring-progress-label', style:{marginTop:8,color: remaining >= 0 ? 'var(--primary)' : 'var(--danger)'}}, '剩余 ' + remaining + ' 千卡');
  text.appendChild(remainText);
  ring.appendChild(text);
  card.appendChild(ring);
  wrap.appendChild(card);

  const meals = [
    {type:'breakfast', label:'早餐', emoji:'🌅'},
    {type:'lunch', label:'午餐', emoji:'☀️'},
    {type:'dinner', label:'晚餐', emoji:'🌙'}
  ];
  meals.forEach(m => {
    const section = h('div', {class:'meal-section'});
    const header = h('div', {class:'meal-header'});
    const title = h('div', {class:'meal-title'});
    title.appendChild(h('span', {class:'meal-emoji'}, m.emoji));
    title.appendChild(document.createTextNode(m.label));
    header.appendChild(title);
    const rec = getMealRecord(m.type);
    header.appendChild(h('div', {class:'meal-calories'}, (rec ? rec.totalCalories : 0) + ' 千卡'));
    section.appendChild(header);

    if (rec && rec.foods.length) {
      const list = h('div', {class:'food-list'});
      rec.foods.forEach((f, i) => {
        const item = h('div', {class:'food-item'});
        const info = h('div');
        info.appendChild(h('div', {class:'food-name'}, f.name));
        info.appendChild(h('div', {class:'food-portion'}, f.portion + 'g'));
        item.appendChild(info);
        const right = h('div', {style:{display:'flex',alignItems:'center',gap:8}});
        right.appendChild(h('span', {class:'food-calories'}, f.calories + ' 千卡'));
        const rm = h('button', {class:'food-remove'}, '✕');
        rm.addEventListener('click', () => removeFoodFromMeal(m.type, i));
        right.appendChild(rm);
        item.appendChild(right);
        list.appendChild(item);
      });
      section.appendChild(list);
    } else {
      section.appendChild(h('div', {class:'empty-meal'}, '还没有添加食物'));
    }
    const btn = h('button', {class:'btn btn-secondary', style:{width:'100%',marginTop:12}}, '+ 添加食物');
    btn.addEventListener('click', () => openPicker(m.type));
    section.appendChild(btn);
    wrap.appendChild(section);
  });
  return wrap;
}

function renderPicker() {
  const overlay = h('div', {class:'modal-overlay'});
  overlay.addEventListener('click', closePicker);
  const modal = h('div', {class:'modal'});
  modal.addEventListener('click', e => e.stopPropagation());
  const header = h('div', {class:'modal-header'});
  const mLabel = {breakfast:'早餐',lunch:'午餐',dinner:'晚餐'};
  header.appendChild(h('div', {class:'modal-title'}, '添加食物到' + mLabel[STATE.pickerOpen]));
  const close = h('button', {class:'modal-close'}, '×');
  close.addEventListener('click', closePicker);
  header.appendChild(close);
  modal.appendChild(header);

  const search = h('div', {class:'search'});
  search.appendChild(h('span', {class:'search-icon'}, '🔍'));
  const input = h('input', {type:'text', placeholder:'搜索食物...', value: STATE.searchQuery});
  input.addEventListener('input', e => {
    STATE.searchQuery = e.target.value;
    const list = modal.querySelector('.food-picker');
    list.innerHTML = '';
    renderFoodPickerItems(list);
  });
  search.appendChild(input);
  modal.appendChild(search);

  const picker = h('div', {class:'food-picker'});
  renderFoodPickerItems(picker);
  modal.appendChild(picker);
  overlay.appendChild(modal);
  return overlay;
}

function renderFoodPickerItems(container) {
  const filtered = FOOD_DATABASE.filter(f => f.name.includes(STATE.searchQuery));
  if (!filtered.length) {
    container.appendChild(h('div', {style:{textAlign:'center',padding:20,color:'var(--text-light)'}}, '没有找到相关食物'));
    return;
  }
  filtered.forEach(food => {
    const item = h('div', {class:'food-picker-item'});
    item.addEventListener('click', () => {
      addFoodToMeal(STATE.pickerOpen, food);
      closePicker();
    });
    const info = h('div', {class:'food-picker-info'});
    info.appendChild(h('div', {class:'food-picker-name'}, food.name));
    item.appendChild(info);
    item.appendChild(h('div', {class:'food-calories'}, food.calories + ' 千卡/100g'));
    container.appendChild(item);
  });
}

function renderAnalysis() {
  const wrap = h('div', {class:'page'});
  wrap.appendChild(h('h1', {class:'page-title'}, '数据分析'));
  if (!STATE.records.length) {
    wrap.appendChild(h('p', {class:'page-subtitle'}, '暂无数据，开始记录后自动生成分析'));
    const empty = h('div', {class:'empty'});
    empty.appendChild(h('div', {class:'empty-emoji'}, '📊'));
    empty.appendChild(h('div', {class:'empty-text'}, '暂无数据', h('br'), '开始记录饮食后，将自动生成分析报告'));
    wrap.appendChild(empty);
    return wrap;
  }
  wrap.appendChild(h('p', {class:'page-subtitle'}, '共记录了 ' + STATE.records.length + ' 天的饮食数据'));

  const pref = analyzePreference(STATE.records);
  const target = calculateTargetCalories(STATE.profile);

  // 7日趋势
  const card1 = h('div', {class:'card'});
  card1.appendChild(h('div', {class:'card-title'}, '近7日热量趋势'));
  const chart = h('div', {style:{display:'flex',alignItems:'flex-end',gap:4,height:120,marginTop:12}});
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const dateStr = d.toISOString().split('T')[0];
    const dayRecs = STATE.records.filter(r => r.date === dateStr);
    const cal = dayRecs.reduce((s,r) => s + r.totalCalories, 0);
    days.push({date:dateStr, cal});
  }
  days.forEach(d => {
    const col = h('div', {style:{flex:1,textAlign:'center'}});
    const height = d.cal > 0 ? Math.min(100, (d.cal/target)*100) : 0;
    const bar = h('div', {style:{
      height: Math.max(0,height) + '%',
      minHeight: d.cal > 0 ? '8px' : 0,
      background: d.cal > 0 ? (d.cal > target ? 'var(--danger)' : 'var(--primary)') : 'var(--border)',
      borderRadius: '4px 4px 0 0',
      transition:'height 0.3s'
    }});
    col.appendChild(bar);
    const date = new Date(d.date);
    col.appendChild(h('div', {style:{fontSize:10,color:'var(--text-light)',marginTop:6}},
      (date.getMonth()+1) + '/' + date.getDate()));
    chart.appendChild(col);
  });
  card1.appendChild(chart);
  const legend = h('div', {style:{marginTop:8,display:'flex',alignItems:'center',gap:8,fontSize:12,color:'var(--text-light)'}});
  legend.appendChild(h('div', {style:{display:'flex',alignItems:'center',gap:4}},
    h('div', {style:{width:8,height:8,background:'var(--primary)',borderRadius:2}}),
    '达标'));
  legend.appendChild(h('div', {style:{display:'flex',alignItems:'center',gap:4}},
    h('div', {style:{width:8,height:8,background:'var(--danger)',borderRadius:2}}),
    '超标'));
  card1.appendChild(legend);
  wrap.appendChild(card1);

  // 目标完成度
  const card2 = h('div', {class:'card'});
  card2.appendChild(h('div', {class:'card-title'}, '目标完成度'));
  const grid = h('div', {class:'stat-grid'});
  [{val:pref.averageCalories,label:'平均每日摄入'},{val:target,label:'每日目标'}].forEach(s => {
    const sc = h('div', {class:'stat-card'});
    sc.appendChild(h('div', {class:'stat-value'}, String(s.val)));
    sc.appendChild(h('div', {class:'stat-label'}, s.label));
    grid.appendChild(sc);
  });
  card2.appendChild(grid);
  const bar = h('div', {class:'progress', style:{marginTop:12}});
  const barInner = h('div', {
    class: 'progress-bar' + (pref.averageCalories > target ? ' danger' : (pref.averageCalories > target*0.9 ? ' warning' : '')),
    style: {width: Math.min(100, (pref.averageCalories/target)*100) + '%'}
  });
  bar.appendChild(barInner);
  card2.appendChild(bar);
  const status = pref.averageCalories >= target - 100 && pref.averageCalories <= target + 100
    ? '✅ 摄入量符合目标'
    : pref.averageCalories < target
    ? '⚠️ 还需增加 ' + (target - pref.averageCalories) + ' 千卡'
    : '⚠️ 超出 ' + (pref.averageCalories - target) + ' 千卡';
  card2.appendChild(h('div', {style:{fontSize:13,color:'var(--text-light)',marginTop:8,textAlign:'center'}}, status));
  wrap.appendChild(card2);

  // 三餐分布
  const card3 = h('div', {class:'card'});
  card3.appendChild(h('div', {class:'card-title'}, '三餐分布'));
  const dist = h('div', {style:{display:'flex',gap:12,marginTop:12}});
  [['🌅','breakfast','早餐'],['☀️','lunch','午餐'],['🌙','dinner','晚餐']].forEach(([emoji,key,label]) => {
    const col = h('div', {style:{flex:1,textAlign:'center'}});
    col.appendChild(h('div', {style:{fontSize:28}}, emoji));
    col.appendChild(h('div', {style:{fontSize:24,fontWeight:700,color:'var(--primary)',margin:'4px 0'}}, pref.mealDistribution[key] + '%'));
    col.appendChild(h('div', {style:{fontSize:12,color:'var(--text-light)'}}, label));
    dist.appendChild(col);
  });
  card3.appendChild(dist);
  wrap.appendChild(card3);

  // 常吃食物
  if (pref.frequentFoods.length) {
    const card4 = h('div', {class:'card'});
    card4.appendChild(h('div', {class:'card-title'}, '常吃食物 TOP 10'));
    pref.frequentFoods.forEach((f, i) => {
      const item = h('div', {class:'preference-item'});
      item.appendChild(h('div', {style:{
        width:24,height:24,
        background: i < 3 ? 'var(--primary)' : 'var(--border)',
        color: i < 3 ? 'white' : 'var(--text)',
        borderRadius:'50%',
        display:'flex',alignItems:'center',justifyContent:'center',
        fontSize:12,fontWeight:600
      }}, String(i+1)));
      item.appendChild(h('span', {style:{flex:1,marginLeft:12}}, f.name));
      item.appendChild(h('span', {style:{color:'var(--text-light)',fontSize:13}}, f.count + ' 次'));
      card4.appendChild(item);
    });
    wrap.appendChild(card4);
  }

  return wrap;
}

      card.appendChild(h('div', {style:{fontSize:14,color:'var(--text-light)',lineHeight:1.6}},
        '至少记录 7 天饮食数据后', h('br'),
        '系统将分析你的饮食偏好', h('br'),
        '并推荐个性化健康食谱'));
      card.appendChild(h('div', {style:{marginTop:16,fontSize:13,color:'var(--text-light)'}},
        '当前已记录 ' + STATE.records.length + ' 天'));
      wrap.appendChild(card);
    } else {
      const pref = analyzePreference(STATE.records);
      const target = calculateTargetCalories(STATE.profile);
      const recommendCard = h('div', {class:'card', style:{background:'var(--primary-light)'}});
      const top = h('div', {style:{display:'flex',alignItems:'center',gap:12,marginBottom:12}});
      top.appendChild(h('div', {style:{fontSize:32}}, '🤖'));
      const tinfo = h('div');
      tinfo.appendChild(h('div', {style:{fontWeight:600,marginBottom:4}}, '基于你的饮食习惯'));
      tinfo.appendChild(h('div', {style:{fontSize:13,color:'var(--primary-dark)'}},
        '你平均每天摄入 ' + pref.averageCalories + ' 千卡'));
      top.appendChild(tinfo);
      recommendCard.appendChild(top);
      if (pref.frequentFoods.length) {
        recommendCard.appendChild(h('div', {style:{fontSize:13,color:'var(--primary-dark)'}},
          '常吃食物：' + pref.frequentFoods.slice(0,5).map(f => f.name).join('、')));
      }
      wrap.appendChild(recommendCard);

      // 推荐前 5 个
      const recs = [...RECIPE_DATABASE].sort((a,b) => {
        const da = Math.abs(a.calories - target/3);
        const db = Math.abs(b.calories - target/3);
        return da - db;
      }).slice(0, 5);
      recs.forEach(r => wrap.appendChild(renderRecipeCard(r)));
    }
  } else {
    // 全部食谱
    const search = h('div', {class:'search'});
    search.appendChild(h('span', {class:'search-icon'}, '🔍'));
    const input = h('input', {type:'text', placeholder:'搜索食谱名称或标签...', value: STATE.searchQuery});
    input.addEventListener('input', e => { STATE.searchQuery = e.target.value; render(); });
    search.appendChild(input);
    wrap.appendChild(search);

    const filters = h('div', {style:{display:'flex',gap:8,marginBottom:16,overflowX:'auto'}});
    [['all','全部'],['breakfast','🌅 早餐'],['lunch','☀️ 午餐'],['dinner','🌙 晚餐']].forEach(([v,l]) => {
      const btn = h('button', {
        class: 'btn btn-sm ' + (STATE.recipeFilter === v ? 'btn-primary' : 'btn-outline'),
        onclick: () => { STATE.recipeFilter = v; render(); }
      }, l);
      filters.appendChild(btn);
    });
    wrap.appendChild(filters);

    const filtered = RECIPE_DATABASE.filter(r => {
      if (STATE.recipeFilter !== 'all' && r.mealType !== STATE.recipeFilter) return false;
      if (STATE.searchQuery && !r.name.includes(STATE.searchQuery) && !r.tags.some(t => t.includes(STATE.searchQuery))) return false;
      return true;
    });
    filtered.forEach(r => wrap.appendChild(renderRecipeCard(r)));
  }
  return wrap;
}

function renderRecipeCard(recipe) {
  const card = h('div', {class:'recipe-card'});
  card.addEventListener('click', () => openRecipe(recipe));
  const img = h('div', {class:'recipe-image', style:{
    display:'flex',alignItems:'center',justifyContent:'center',
    fontSize:48,color:'var(--text-light)'
  }}, '🍽️');
  card.appendChild(img);
  const content = h('div', {class:'recipe-content'});
  content.appendChild(h('div', {class:'recipe-name'}, recipe.name));
  content.appendChild(h('div', {class:'recipe-desc'}, recipe.description));
  const tags = h('div', {class:'recipe-tags'});
  recipe.tags.forEach(t => tags.appendChild(h('span', {class:'tag'}, t)));
  content.appendChild(tags);
  const stats = h('div', {class:'recipe-stats'});
  [{val:recipe.calories,label:'千卡'},{val:recipe.protein+'g',label:'蛋白质'},{val:recipe.cookTime+'分钟',label:'制作时间'}].forEach(s => {
    const sc = h('div', {class:'recipe-stat'});
    sc.appendChild(h('div', {class:'recipe-stat-value'}, String(s.val)));
    sc.appendChild(h('div', {class:'recipe-stat-label'}, s.label));
    stats.appendChild(sc);
  });
  content.appendChild(stats);
  card.appendChild(content);
  return card;
}

function renderRecipeDetail() {
  const r = STATE.selectedRecipe;
  const wrap = h('div', {class:'page'});
  const back = h('button', {class:'btn btn-secondary', style:{marginBottom:16}});
  back.appendChild(document.createTextNode('← 返回食谱列表'));
  back.addEventListener('click', closeRecipe);
  wrap.appendChild(back);

  const hero = h('div', {class:'recipe-detail-image', style:{
    display:'flex',alignItems:'center',justifyContent:'center',fontSize:80
  }}, '🍽️');
  wrap.appendChild(hero);
  wrap.appendChild(h('h2', {style:{fontSize:24,fontWeight:700}}, r.name));
  wrap.appendChild(h('p', {style:{color:'var(--text-light)',marginTop:8,lineHeight:1.6}}, r.description));

  const grid1 = h('div', {class:'stat-grid', style:{marginTop:16}});
  [{val:r.calories,label:'热量 (千卡)'},{val:r.cookTime,label:'制作时间 (分钟)'}].forEach(s => {
    const sc = h('div', {class:'stat-card'});
    sc.appendChild(h('div', {class:'stat-value'}, String(s.val)));
    sc.appendChild(h('div', {class:'stat-label'}, s.label));
    grid1.appendChild(sc);
  });
  wrap.appendChild(grid1);

  const grid2 = h('div', {class:'stat-grid'});
  [{val:r.protein+'g',color:'var(--primary)'},{val:r.carbs+'g',color:'var(--accent)'}].forEach(s => {
    const sc = h('div', {class:'stat-card'});
    sc.appendChild(h('div', {style:{fontSize:16,fontWeight:700,color:s.color}}, s.val));
    sc.appendChild(h('div', {class:'stat-label'}, s === grid2.children[0] ? '蛋白质' : '碳水'));
    grid2.appendChild(sc);
  });
  wrap.appendChild(grid2);

  const tagSection = h('div', {class:'recipe-detail-section'});
  tagSection.appendChild(h('div', {class:'recipe-detail-section-title'}, '🏷️ 标签'));
  const tags = h('div', {class:'recipe-tags', style:{marginTop:8}});
  r.tags.forEach(t => tags.appendChild(h('span', {class:'tag'}, t)));
  tagSection.appendChild(tags);
  wrap.appendChild(tagSection);

  const ingSection = h('div', {class:'recipe-detail-section'});
  ingSection.appendChild(h('div', {class:'recipe-detail-section-title'}, '🥕 所需食材'));
  const list = h('div', {class:'recipe-detail-list'});
  r.ingredients.forEach(i => {
    const item = h('div', {class:'recipe-detail-item'});
    item.appendChild(h('span', null, '•'));
    item.appendChild(document.createTextNode(i));
    list.appendChild(item);
  });
  ingSection.appendChild(list);
  wrap.appendChild(ingSection);

  const stepSection = h('div', {class:'recipe-detail-section'});
  stepSection.appendChild(h('div', {class:'recipe-detail-section-title'}, '👨‍🍳 制作步骤'));
  r.steps.forEach((s, i) => {
    const step = h('div', {class:'recipe-detail-step'});
    step.appendChild(h('div', {class:'step-number'}, String(i+1)));
    step.appendChild(h('div', null, s));
    stepSection.appendChild(step);
  });
  wrap.appendChild(stepSection);

  return wrap;
}

// ============ 启动 ============
render();

})();
</script>
</body>
</html>
